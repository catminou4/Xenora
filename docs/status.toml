schema_version = 1
phase = 1
release_ready = false

[[feature]]
id = "native-compute"
implementation = "implemented"
correctness = "initial-native-suite-passed"
hardware_verification = "verified"
hardware_target = "Apple M5"
claims = ["CLAIM-METAL-M5-NATIVE-SUITE"]
architecture = "arm64 macOS"
semantics = "Native Metal work submissions with bounded resources"
metal_mapping = "Native compute kernels and an original offscreen render test"
limitations = "Trusted MSL with bounded word buffers and an original native offscreen rendering test on Apple M5."
test = "scripts/test-gpu.sh"

[[feature]]
id = "synthetic-gfx1030"
implementation = "three-fixture-demo-implemented"
correctness = "three-way-output-passed"
hardware_verification = "verified"
hardware_target = "Apple M5"
claims = ["CLAIM-METAL-M5-RDNA-DEMO", "CLAIM-RDNA2-ADD-NO-CARRY", "CLAIM-RDNA2-SOPP-BRANCH-DISPLACEMENT"]
architecture = "gfx1030 Wave32"
semantics = "Original gfx1030 compute code under the synthetic fixture ABI"
metal_mapping = "One lane-indexed MSL compute invocation per word"
limitations = "Synthetic memory contract, statically resolved forward control flow, exact positive normal FP32 only."
test = "scripts/demo.sh"

[[feature]]
id = "guest-graphics-path"
implementation = "implemented"
correctness = "guest-frame-readback-passed"
hardware_verification = "verified"
hardware_target = "Apple M4"
claims = ["CLAIM-GUEST-GRAPHICS-METAL", "CLAIM-GUEST-TEXTURED-METAL"]
architecture = "arm64 macOS"
semantics = "Guest programs author graphics commands that render through the translated gfx1030 vertex and pixel stages, and bind their own texture for a sampled draw"
metal_mapping = "Native Metal offscreen rendering behind the guest graphics service boundary"
limitations = "One triangle per draw, one instance, a float4 position plus an optional float4 texture coordinate per vertex, R8G8B8A8 render targets and textures of at most 64 by 64 pixels, a point sampler with clamp addressing, and synchronous draw execution and readback. Constant buffers, upload and readback heaps, render target views and depth views are not yet exposed to the guest."
test = "cargo test --locked -p xenora-loader --features gpu-tests --test guest_graphics_path --test guest_textured_path"

[[feature]]
id = "guest-cpp-path"
implementation = "implemented"
correctness = "guest-cpp-program-passed"
hardware_verification = "not-applicable"
claims = ["CLAIM-GUEST-CPP-PATH"]
architecture = "arm64 macOS"
semantics = "A hosted C++ guest runs its constructors, standard library containers, threads, thread-local storage and file input and output through the loader and the ARM64 dynamic binary translation"
metal_mapping = "Not applicable; this milestone exercises the guest CPU and runtime, not the GPU"
limitations = "C++ exceptions and stack unwinding are not implemented and are not exercised; the program is built with -fno-exceptions and -fno-rtti. One worker thread, one guest at a time under the deterministic cooperative scheduler, and a bounded command-line and file environment."
test = "cargo test --locked -p xenora-loader --test guest_cpp_path"

[[feature]]
id = "xbox-execution"
implementation = "unsupported"
correctness = "untested"
hardware_verification = "unverified"
claims = ["CLAIM-XBOX-ISA-ABI"]
architecture = "Xbox Series X|S"
semantics = "Console-specific GPU and guest execution contracts remain unknown"
metal_mapping = "Unresolved"
limitations = "Game execution, proprietary guest containers and full guest execution-mask divergence are unsupported. The console launch ABI is unknown."


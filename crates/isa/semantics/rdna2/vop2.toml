# ---- VOP2 binary32 arithmetic (#784) ----
# AMD RDNA 2 ISA guide 12.7: ADD, SUB, SUBREV and MUL on page 131, MIN on page
# 132 and MAX on page 133. Per lane under EXEC; no SCC, VCC or EXEC write.
# SRC0 is a VGPR, normal SGPR, vcc_lo or a literal: the guide does not say how a
# float operation reads an integer inline constant. Unsupported at run time
# (docs/shaders/vector-binary-f32.md): NaN inputs to ADD/SUB/SUBREV/MUL and
# signalling NaN inputs to MIN/MAX (src_nan; MODE.IEEE and Quiet() are not
# pinned), subnormal inputs, and ADD/SUB/SUBREV/MUL results that are NaN or
# whose exact value is nonzero and below 2^-126 in magnitude (MODE.FP_DENORM
# output flushing is not pinned, and Metal flushes subnormals).
[operand_rules.vop2_f32]
family = "VOP2"
dst = { field = "VDST", class = "vgpr", min = 0, max = 255 }
src = [
  { field = "SRC0", class = "vector_source" },
  { field = "VSRC1", class = "vgpr" },
]
max_literals = 1
unsupported = [
  "src_vcc_hi", "src_exec", "src_m0", "src_ttmp", "src_null", "src_inline", "src_float_inline",
  "src_special", "src_nan",
]

[[form]]
name = "V_ADD_F32"
family = "VOP2"
opcode = 3
variant = "AddF32"
operation = "add"
signedness = "float"
carry_in = "none"
width = 32
scc = "unchanged"
vcc = "unchanged"
exec = "unchanged"
wave = "any"
operands = "vop2_f32"
spec = [{ document = "guide", section = "12.7", page = 131 }]
verify = ["reference", "independent", "metal", "llvm_encoding"]


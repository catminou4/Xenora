# ---- VOP2 logical and shift forms migrated from hand-written code (#215 M27) ----
# Per lane under EXEC; no SCC, VCC or EXEC write (guide 12.7). The shifts read
# their sources reversed: D = S1 shifted by S0[4:0]; ASHRREV fills with S1's sign.
# These keep the subset the hand-written decoder accepted: both sources VGPRs.
[operand_rules.vop2_vgpr2]
family = "VOP2"
dst = { field = "VDST", class = "vgpr", min = 0, max = 255 }
src = [
  { field = "SRC0", class = "vgpr" },
  { field = "VSRC1", class = "vgpr" },
]
max_literals = 0
unsupported = [
  "src_sgpr", "src_vcc", "src_exec", "src_m0", "src_ttmp", "src_null", "src_inline",
  "src_float_inline", "src_special", "src_literal",
]

